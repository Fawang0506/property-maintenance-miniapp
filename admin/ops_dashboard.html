<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物业运维运营大屏</title>
    <style>
      :root {
        --bg: #09111d;
        --panel: #101b2e;
        --panel-soft: #0d1729;
        --line: rgba(255,255,255,.08);
        --text: #ecf3ff;
        --muted: #9bb0cc;
        --primary: #48a5ff;
        --success: #31d0aa;
        --warning: #f5b942;
        --danger: #ff5a67;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #06101b, #0d1728 25%, #091422 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      }
      .app { max-width: 1500px; margin: 0 auto; padding: 20px; }
      .topbar {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px; margin-bottom: 20px;
      }
      .title {
        font-size: 32px; font-weight: 700; letter-spacing: 1px;
      }
      .toolbar {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      }
      .toolbar select, .toolbar button {
        background: rgba(255,255,255,.04);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .toolbar button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #07111d;
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .card {
        background: linear-gradient(180deg, rgba(17,29,46,.92), rgba(15,25,38,.98));
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
      }
      .card h3 { margin: 0 0 10px; color: var(--muted); font-weight: 500; font-size: 13px; }
      .value {
        font-size: 36px; font-weight: 700;
        letter-spacing: 0.5px;
      }
      .trend {
        display: flex; align-items: flex-end; gap: 10px; height: 180px;
        margin-top: 10px;
      }
      .bar-day {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px;
      }
      .bar-fill {
        width: 100%; max-width: 30px; border-radius: 8px 8px 0 0;
        background: linear-gradient(180deg, #84d4ff, var(--primary));
      }
      .day-label { font-size: 12px; color: var(--muted); }
      .section {
        margin-top: 24px; display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 18px;
      }
      .bar-wrap { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
      .bar {
        height: 16px; display: inline-block; border-radius: 8px;
        background: linear-gradient(90deg, var(--primary), #7cc7ff);
      }
      .tiny { color: var(--muted); font-size: 12px; }
      .alert-list {
        display: flex; flex-direction: column; gap: 10px;
      }
      .alert-item {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,90,103,.24);
        background: rgba(255,90,103,.06);
      }
      .alert-meta { display: flex; flex-direction: column; gap: 3px; }
      .badge {
        display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
      }
      .badge.warning { background: rgba(245,185,66,.18); color: var(--warning); }
      .badge.critical { background: rgba(255,90,103,.18); color: var(--danger); }
      table {
        width: 100%; border-collapse: collapse; background: transparent;
      }
      th, td {
        padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left;
        color: var(--text);
      }
      .status-chip {
        display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px;
      }
      .status-chip.ready { background: rgba(49,208,170,.12); color: var(--success); }
      .status-chip.warn { background: rgba(245,185,66,.12); color: var(--warning); }
      .status-chip.danger { background: rgba(255,90,103,.12); color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="title">物业运维运营大屏</div>
        <div class="toolbar">
          <select id="rangeSelect">
            <option value="7">最近 7 天</option>
            <option value="14">最近 14 天</option>
            <option value="30">最近 30 天</option>
            <option value="90">最近 90 天</option>
          </select>
          <button id="exportBtn" class="primary">导出 CSV</button>
        </div>
      </div>

      <div id="dashboardCards" class="grid"></div>

      <div class="section">
        <div class="card">
          <h3>工单趋势</h3>
          <div id="trendChart" class="trend"></div>
        </div>
        <div class="card">
          <h3>区域分布</h3>
          <div id="areaChart"></div>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <h3>优先级分布</h3>
          <div id="priorityChart"></div>
        </div>
        <div class="card">
          <h3>工程师绩效</h3>
          <div id="engineerPerformance"></div>
        </div>
      </div>

      <div class="section" style="grid-template-columns: 1fr;">
        <div class="card">
          <h3>超时预警</h3>
          <div id="alertList" class="alert-list"></div>
        </div>
      </div>
    </div>

    <script src="./ops_dashboard_app.js"></script>
  </body>
</html>
